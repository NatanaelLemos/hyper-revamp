[workspace]
resolver = "2"
members = [
    "crates/hyper-term",
    "crates/hyper-config",
    "crates/hyper-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
alacritty_terminal = "0.26"
portable-pty = "0.9"
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
egui = "0.35"
arboard = "3.6"
crossbeam-channel = "0.5"
slotmap = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
notify = "8"
notify-debouncer-full = "0.7"
csscolorparser = "0.7"
muda = "0.19"
notify-rust = "4"
clap = { version = "4", features = ["derive"] }
rfd = "0.17"
open = "5"
lru = "0.12"
tempfile = "3"
sys-locale = "0.3"
regex = "1"
log = "0.4"
env_logger = "0.11"
dirs = "5"
indexmap = { version = "2", features = ["serde"] }

[profile.release]
lto = "thin"
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
